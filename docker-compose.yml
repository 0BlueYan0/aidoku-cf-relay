services:
  relay:
    image: ghcr.io/0blueyan0/aidoku-cf-relay:latest
    restart: unless-stopped
    ports:
      - "8191:8080"
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Set RELAY_TOKEN in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      TRAWL_URL: http://trawl:8191
      WARM_UP: ${WARM_UP:-1}
      KEEP_WARM_DAYS: ${KEEP_WARM_DAYS:-7}
      CHECK_MINUTES: ${CHECK_MINUTES:-30}
    volumes:
      - relay-data:/data
    depends_on:
      - trawl

  # Solves the Cloudflare challenge in a browser, only when the relay has no clearance yet
  # or the site refuses it. Not exposed outside this compose project.
  trawl:
    image: ghcr.io/germondai/trawl:1.8.0
    restart: unless-stopped
    shm_size: 2g
    environment:
      BROWSER_POOL_SIZE: "1"
      BROWSER_ACQUIRE_TIMEOUT_MS: "90000"

volumes:
  relay-data:
